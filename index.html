<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Drive Markdown</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Drive Markdown</div>
    <div class="top-actions">
      <button id="settingsBtn" class="icon-btn" aria-label="설정">⚙︎</button>
      <button id="loginBtn" class="btn primary">Google 로그인</button>
    </div>
  </header>

  <main class="app-shell">
    <section id="welcome" class="panel welcome">
      <h1>Google Drive의 Markdown을 그대로</h1>
      <p>파일을 복사하지 않고 Drive에 있는 <strong>.md</strong> 원본을 열고 수정합니다.</p>
      <button id="welcomeLoginBtn" class="btn primary large">Google Drive 연결</button>
      <p id="welcomeHint" class="muted">처음 한 번은 설정에서 OAuth Client ID와 Drive 폴더 ID를 입력합니다.</p>
    </section>

    <section id="browserView" class="hidden">
      <div class="navline">
        <button id="homeBtn" class="btn ghost">⌂</button>
        <button id="upBtn" class="btn ghost" disabled>‹</button>
        <div id="breadcrumb" class="breadcrumb">Drive</div>
        <button id="refreshBtn" class="btn ghost">↻</button>
      </div>

      <div class="list-tools">
        <input id="searchBox" type="search" placeholder="파일 검색">
      </div>

      <div id="fileList" class="file-list"></div>
    </section>

    <section id="documentView" class="hidden">
      <div class="docbar">
        <button id="backBtn" class="btn ghost">‹ 목록</button>
        <div id="docTitle" class="doc-title"></div>
        <div class="doc-actions">
          <button id="editBtn" class="btn">편집</button>
          <button id="saveBtn" class="btn primary hidden">저장</button>
          <button id="cancelBtn" class="btn hidden">취소</button>
        </div>
      </div>

      <article id="viewer" class="markdown-body"></article>
      <textarea id="editor" class="editor hidden" spellcheck="false"></textarea>
      <div id="saveState" class="save-state"></div>
    </section>
  </main>

  <dialog id="settingsDialog">
    <form method="dialog" class="settings">
      <div class="settings-head">
        <h2>설정</h2>
        <button value="cancel" class="icon-btn">✕</button>
      </div>

      <label>
        Google OAuth Client ID
        <input id="clientIdInput" type="text" autocomplete="off" placeholder="...apps.googleusercontent.com">
      </label>

      <label>
        Google Drive 폴더 ID
        <input id="folderIdInput" type="text" autocomplete="off" placeholder="drive.google.com/drive/folders/ 뒤의 값">
      </label>

      <p class="muted small">
        두 값은 이 기기의 브라우저에만 저장됩니다. Client Secret은 입력하지 않습니다.
      </p>

      <div class="settings-actions">
        <button id="clearSettingsBtn" type="button" class="btn danger">설정 지우기</button>
        <button id="saveSettingsBtn" type="button" class="btn primary">저장</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast hidden"></div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
